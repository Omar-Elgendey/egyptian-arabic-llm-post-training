### model
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora

lora_rank: 64
lora_target: all

quantization_bit: 4
upcast_layernorm: true

### dataset
dataset: egyptian_sft
eval_dataset: egyptian_sft_eval

template: qwen
cutoff_len: 2048

overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /content/drive/MyDrive/ds/models/egyptian-qwen-sft

logging_steps: 10

save_strategy: steps
save_steps: 500
save_total_limit: 2

plot_loss: true

### training
per_device_train_batch_size: 1
gradient_accumulation_steps: 4

learning_rate: 1.0e-4
num_train_epochs: 1.0

lr_scheduler_type: cosine
warmup_steps: 1500

fp16: true
gradient_checkpointing: true

### evaluation
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500