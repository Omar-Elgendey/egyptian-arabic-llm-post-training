### model
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
trust_remote_code: true

### method
stage: dpo
do_train: true
finetuning_type: lora

lora_rank: 16
lora_alpha: 32
lora_target: all

quantization_bit: 4
upcast_layernorm: true

pref_beta: 0.1
pref_loss: sigmoid

### dataset
dataset_dir: /content/dpo_data
dataset: egyptian_dpo
eval_dataset: egyptian_dpo_eval

template: qwen
cutoff_len: 1024

overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: /content/drive/MyDrive/ds/models/egyptian-qwen-DPO-50k
logging_steps: 10

save_strategy: steps
save_steps: 200
save_total_limit: 2

plot_loss: true

### training
per_device_train_batch_size: 1
gradient_accumulation_steps: 16

learning_rate: 1.0e-5
num_train_epochs: 1.0

lr_scheduler_type: cosine
warmup_ratio: 0.1

fp16: true
gradient_checkpointing: true

### evaluation
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200